# diaspora.conf - the peers of this repository, what moves between them and
# what an import must pass.  Read by diaspora (github.com/kev-cam/diaspora).
# Values run to the end of the line as written; comments are whole lines.
# Settings for one machine only go in diaspora.local.conf (not committed).

[diaspora]
	target = master
	import = bugfix security perf
	ignore = docs ci style
	export = bugfix

# Nick Gasson's nvc, which this repository was forked from.
[peer "nickg"]
	url = https://github.com/nickg/nvc.git
	branch = master
	# his release notes, web site and CI are his own
	exclude = www/** NEWS.md .github/**

# Nearly every commit, ours and the peer's, adds a line to
# test/regress/testlist.txt or NEWS.md; both sides changing one is not
# counted as touching our files.
[divergence]
	lists = test/regress/testlist.txt NEWS.md

# Commands run in the import worktree ($DIASPORA_SRC); its build directory
# ($DIASPORA_BUILD) is kept between runs, so only the first build is long.
#
# configure turns maintainer mode off in a worktree (.git is a file there),
# and then make neither regenerates a lexer or parser whose source changed
# nor notices a changed Makemodule.am: an import would be tested with a
# stale build.  So the first line configures again whenever the build
# system's inputs change, and am__skiplex/am__skipyacc are emptied so that
# flex and bison run when they should.
#
# smak first, then make -k to complete the VHDL libraries (as `regress gate`
# builds nvc); the last, serial make has to find nothing left to fail.
[test "compile"]
	run = cd "$DIASPORA_SRC" && sig=$(git ls-files -s configure.ac Makefile.am '*Makemodule.am' m4 | sha1sum) && { [ "$sig" = "$(cat "$DIASPORA_BUILD/.buildsys" 2>/dev/null)" ] || { ./autogen.sh && mkdir -p "$DIASPORA_BUILD" && cd "$DIASPORA_BUILD" && "$DIASPORA_SRC/configure" 'CFLAGS=-O2 -g -fPIC' && echo "$sig" > .buildsys; }; }
	run = cd "$DIASPORA_BUILD" && M='am__skiplex= am__skipyacc=' && { smak -j"$(nproc)" $M everything || true; } && { make -k -j"$(nproc)" $M everything || true; } && make $M everything
	timeout = 1h

# The blocks `regress gate --repo nvc` runs (nvc's own regression and unit
# tests, ivtest through nvc), on the import's build.  Many of their tests
# fail on master, so the gate is that no test fails that did not fail before
# the import; a new failure is run a second time before it counts.
[test "full-regression"]
	needs = compile
	run = "${SV2GHDL_SRC_ROOT:-/usr/local/src}/sv2ghdl/regress/regress" candidate --repo nvc --src "$DIASPORA_SRC" --build "$DIASPORA_BUILD" --failures "$DIASPORA_FAILURES"
	pass = no-new-failures
	retry = 1
	timeout = 2h

# Every import passes the full regression, whatever kind of change it is.
[require]
	default = full-regression
